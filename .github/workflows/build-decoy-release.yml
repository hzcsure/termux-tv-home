# ============================================================================
# Release TV Decoy（透明前台诱饵 app，供 termux-home 桌面做 force-stop 保护）
#
# 与 build-decoy.yml 的分工：
#   build-decoy.yml         —— 分支推送改动 tvdecoy/** 时做回归构建（debug 变体，只留 artifact）
#   build-decoy-release.yml —— 打 decoy-v*.*.* tag 时产出可安装的 release 变体 + GitHub Release
#
# 为什么要单开一个文件：GitHub 的 push 过滤器里 paths 对 tag 推送同样求值，
# 若在原文件追加 tags，打在“未改 tvdecoy 的 commit”上的 tag 会被 paths 挡掉。
# tag 发布链路不能依赖 paths 是否命中，故独立成文件、只要 tag 匹配就构建。
# ============================================================================

name: Release TV Decoy

on:
  push:
    tags:
      - 'decoy-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（三段式，如 1.0.0）'
        required: true
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: decoy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish decoy APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 版本号只有一个来源：tag（或手动输入的 version）。
      # versionCode 由三段式算出 10000*MAJOR + 100*MINOR + PATCH，随 tag 单调递增，
      # 避免出现“tag 升了但 APK 里 versionCode 还是 1，adb install 判定为同一版本”。
      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#decoy-v}"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::非法版本号 '$V'，要求三段式如 1.0.0"
            exit 1
          fi
          MAJOR="${V%%.*}"
          REST="${V#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          echo "version=$V"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"  >> "$GITHUB_OUTPUT"
          echo "解析结果: versionName=$V versionCode=$CODE"

      # 只构建 :tvdecoy，避免裸 assemble 把 app / terminal-* 一并拉起来
      - name: Build release APK
        run: |
          ./gradlew :tvdecoy:assembleRelease --no-daemon \
            -PdecoyVersionName='${{ steps.ver.outputs.version }}' \
            -PdecoyVersionCode='${{ steps.ver.outputs.code }}'

      # 硬校验：产物必须真的是 com.hzc.tvdecoy、版本与 tag 一致、minSdk=21。
      # 一旦 -P 覆盖失效（Gradle 属性名写错之类），这里立刻失败，不会把错包发出去。
      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK=$(ls tvdecoy/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          # 新版 build-tools 里 aapt 可能被裁掉，aapt2 的 badging 输出格式与之一致
          AAPT=""
          for c in aapt aapt2; do
            P=$(ls "$ANDROID_HOME"/build-tools/*/"$c" 2>/dev/null | sort -V | tail -1)
            if [ -n "$P" ]; then AAPT="$P"; break; fi
          done
          [ -n "$AAPT" ] || { echo "::error::找不到 aapt/aapt2"; exit 1; }
          echo "using $AAPT"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          head -3 /tmp/badging.txt
          grep -q "package: name='com.hzc.tvdecoy'" /tmp/badging.txt || { echo "::error::包名不符"; exit 1; }
          grep -q "versionCode='${{ steps.ver.outputs.code }}'" /tmp/badging.txt || { echo "::error::versionCode 与 tag 不一致"; exit 1; }
          grep -q "versionName='${{ steps.ver.outputs.version }}'" /tmp/badging.txt || { echo "::error::versionName 与 tag 不一致"; exit 1; }
          grep -q "sdkVersion:'21'" /tmp/badging.txt || { echo "::error::minSdk 不是 21"; exit 1; }
          echo "APK 校验通过"

      - name: Rename & checksum
        id: pack
        run: |
          set -euo pipefail
          OUT="tvdecoy-v${{ steps.ver.outputs.version }}.apk"
          mkdir -p dist
          cp tvdecoy/build/outputs/apk/release/*.apk "dist/$OUT"
          ( cd dist && sha256sum "$OUT" > "$OUT.sha256" && cat "$OUT.sha256" )
          ls -l dist
          echo "apk=dist/$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvdecoy-v${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TV Decoy v${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            tvdecoy —— termux-home 桌面的透明前台诱饵，用于在息屏 / 内存回收时替桌面承受
            小米 PowerManagerService 的 `forceStopPackage`。

            - 包名：`com.hzc.tvdecoy`（必须与 termux-home 独立安装，同包名会使保护失效）
            - 版本：`${{ steps.ver.outputs.version }}`（versionCode `${{ steps.ver.outputs.code }}`）
            - minSdk 21 / targetSdk 33，release 变体，用仓库内固定的
              `app/testkey_untrusted.jks` 签名，可直接 `adb install` 原地覆盖升级
            - 安装后无需额外配置，termux-home 在 `onResume` 后会自动把它拉到栈顶
          files: |
            dist/*.apk
            dist/*.sha256
