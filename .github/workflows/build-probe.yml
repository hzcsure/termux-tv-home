# ============================================================================
# 构建回归测试探针（probe）
# 用途: 只声明 LEANBACK_LAUNCHER 的最小应用，用于验证 TVHome 桌面
#       1) 能否发现纯 TV 入口
#       2) 新装包后是否即时刷新
# 触发: 手动 workflow_dispatch（不参与发布）
# ============================================================================

name: Build Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build probe APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build probe APK
        run: ./gradlew :probe:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: probe/build/outputs/apk/release/*.apk
          retention-days: 30
