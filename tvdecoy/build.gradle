plugins {
    id 'com.android.application'
}

// 版本号默认值。CI 打 tag 时用 -PdecoyVersionName=1.2.3 -PdecoyVersionCode=10203
// 覆盖，保证产物版本号与 tag 严格一致。
// 刻意在 android {} 之外用普通 def 求值：defaultConfig 闭包里做 findProperty
// 会被 AGP/Gradle 9 的委托解析吃掉（曾实测报 "Value is null"）。
def decoyVersionName = project.hasProperty('decoyVersionName')
        ? project.property('decoyVersionName').toString()
        : '1.0.0'
def decoyVersionCode = project.hasProperty('decoyVersionCode')
        ? project.property('decoyVersionCode').toString().trim().toInteger()
        : 1

android {
    namespace 'com.hzc.tvdecoy'
    // 复用 termux CI runner 已装好的 SDK（与仓库 app 模块一致，避免缺平台）
    compileSdk 36

    defaultConfig {
        applicationId 'com.hzc.tvdecoy'
        minSdk 21
        targetSdk 33
        versionCode decoyVersionCode
        versionName decoyVersionName
    }

    // 固定签名。
    //
    // 之前 release 用 signingConfigs.debug，而 GitHub runner 每次都是全新的
    // ~/.android/debug.keystore（密钥材料随机）⇒ 1.0.0 与 1.0.1 签名不同 ⇒
    // adb install -r 报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，每次升级都得先卸载
    // （2026-11-28 在 MiBOX3 上实测，证书 sha256 分别是 d5b04605… / 02681e0f…）。
    //
    // 改签仓库内自带的 termux 官方测试密钥 app/testkey_untrusted.jks：
    // 文件跟着 git 走，本机与 CI 得到完全相同的证书，可原地覆盖升级。
    // 这是"测试密钥"，与 termux 正式发布用的密钥无关，也无对外分发风险。
    signingConfigs {
        stable {
            storeFile file('../app/testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        debug {
            signingConfig signingConfigs.stable
        }
    }
}

dependencies {
    // 纯 framework，无第三方依赖
}
