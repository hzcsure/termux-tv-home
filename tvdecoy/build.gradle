plugins {
    id 'com.android.application'
}

// 版本号默认值。CI 打 tag 时用 -PdecoyVersionName=1.2.3 -PdecoyVersionCode=10203
// 覆盖，保证产物版本号与 tag 严格一致。
// 刻意在 android {} 之外用普通 def 求值：defaultConfig 闭包里做 findProperty
// 会被 AGP/Gradle 9 的委托解析吃掉（曾实测报 "Value is null"）。
def decoyVersionName = project.hasProperty('decoyVersionName')
        ? project.property('decoyVersionName').toString()
        : '1.0.0'
def decoyVersionCode = project.hasProperty('decoyVersionCode')
        ? project.property('decoyVersionCode').toString().trim().toInteger()
        : 1

android {
    namespace 'com.hzc.tvdecoy'
    // 复用 termux CI runner 已装好的 SDK（与仓库 app 模块一致，避免缺平台）
    compileSdk 36

    defaultConfig {
        applicationId 'com.hzc.tvdecoy'
        minSdk 21
        targetSdk 33
        versionCode decoyVersionCode
        versionName decoyVersionName
    }

    // 用 debug 密钥给 release 变体签名，保证 `./gradlew assembleRelease`（termux 发布时
    // 会顺带配置本模块）不会因“无签名配置”而失败。个人 TV 助手类 app 足够。
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // 纯 framework，无第三方依赖
}
